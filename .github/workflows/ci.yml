name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.13.4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run ruff
        run: uv run ruff check src/ tests/

      - name: Run mypy
        run: uv run mypy src/ --explicit-package-bases || true

      - name: Run security scan (bandit)
        run: uv tool run bandit -r src/ || true

      - name: Audit dependencies
        # The old step ran `uv audit` for real (uv >= 0.11) but `|| true` turned
        # every advisory into a green build. This gate reads the frozen lock, so
        # CI cannot disagree with uv.lock.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.13.4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests + coverage
        env:
          # Tests are mocked; secrets are not required but provided to
          # avoid implicit-failure in case any test reads env.
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY || 'mock-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-key' }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY || 'mock-key' }}
          XIAOMI_MIMO_API_KEY: ${{ secrets.XIAOMI_MIMO_API_KEY || 'mock-key' }}
        run: uv run pytest --cov --cov-report=term-missing tests/ -v

      - name: Enforce coverage threshold
        run: uv run coverage report
